[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidiel"
version = "0.1.0"
description = "Local-only desktop video downloader and converter powered by yt-dlp and ffmpeg"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "yt-dlp>=2025.1.0",
]

[project.scripts]
vidiel = "vidiel.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
